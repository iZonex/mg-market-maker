[package]
name = "mm-strategy-graph"
edition.workspace = true
version.workspace = true

# Epic H — visual strategy builder backend.
#
# Typed DAG of nodes (closed catalog) the engine evaluates on every tick.
# See `docs/research/visual-strategy-builder.md` for the architecture.
#
# This crate owns the graph + evaluator + node catalog. It pulls in
# computation crates (`mm-indicators`, `mm-strategy`) that node kinds
# delegate to, but deliberately avoids orderbook / connector deps —
# engine integration happens in `mm-engine`, not here, so the crate
# stays unit-testable without mocking orderbooks + connectors.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
anyhow = { workspace = true }
mm-indicators = { workspace = true }
mm-strategy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
once_cell = "1"

[lints]
workspace = true
